<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ILA — Intelligence Layer for Analytics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Syne:wght@400;500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            display: ['Syne', 'sans-serif'],
            body: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            ink: {
              950: '#07080A',
              900: '#0D0F14',
              800: '#13161D',
              700: '#1A1E27',
              600: '#232830',
              500: '#2E3340',
            },
            amber: {
              400: '#F59E0B',
              500: '#D97706',
            },
            risk: {
              critical: '#EF4444',
              high: '#F97316',
              medium: '#EAB308',
              low: '#22C55E',
              info: '#3B82F6',
            }
          }
        }
      }
    }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; }
    body {
      font-family: 'Inter', sans-serif;
      background: #07080A;
      color: #E8EAF0;
      -webkit-font-smoothing: antialiased;
    }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2E3340; border-radius: 2px; }
    ::-webkit-scrollbar-thumb:hover { background: #3E4455; }

    /* Scan-line overlay for cybersec aesthetic */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(255,255,255,0.008) 2px,
        rgba(255,255,255,0.008) 4px
      );
      pointer-events: none;
      z-index: 9999;
    }

    @keyframes pulse-ring {
      0% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(2.5); }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }
    @keyframes slide-in-right {
      from { opacity: 0; transform: translateX(24px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes slide-in-top {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes count-up {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-slide-right { animation: slide-in-right 0.3s ease forwards; }
    .animate-slide-top { animation: slide-in-top 0.2s ease forwards; }
    .live-dot::before {
      content: '';
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #EF4444;
      margin-right: 6px;
      animation: blink 1.4s ease-in-out infinite;
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
