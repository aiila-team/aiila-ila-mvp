# ============================================================
# AIILA — ILA v0.1 MVP  |  .github/workflows/ci.yml
# Owner: Sridhar — Cloud + DevOps + Infrastructure
# Trigger: push to dev or PR to main
# Steps: lint → test → docker build → report
# ============================================================

name: CI Pipeline

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ──────────────────────────────────────────────────────────
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install linting tools
        run: pip install ruff black isort

      - name: Ruff lint (backend)
        run: ruff check backend/

      - name: Black format check (backend)
        run: black --check backend/

      - name: isort check (backend)
        run: isort --check-only backend/

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: cd frontend && npm ci

      - name: ESLint (frontend)
        run: cd frontend && npm run lint

  # ──────────────────────────────────────────────────────────
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: ila_test
          POSTGRES_USER: ila_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run pytest with coverage
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: ila_test
          POSTGRES_USER: ila_user
          POSTGRES_PASSWORD: test_password
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/1
          CELERY_RESULT_BACKEND: redis://localhost:6379/2
          SECRET_KEY: test_secret_key_not_for_production_32chars
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 60
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: test
          APP_ENV: testing
        run: |
          cd backend
          pytest tests/ -v --cov=app --cov-report=xml --cov-report=term-missing
        continue-on-error: false

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          file: backend/coverage.xml
          flags: backend

  # ──────────────────────────────────────────────────────────
  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [lint, test-backend]
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (verify it builds)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: ila-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image (verify it builds)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: ila-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────────────────
  integration-test:
    name: Docker Compose Integration Test
    runs-on: ubuntu-latest
    needs: build-images
    if: github.ref == 'refs/heads/dev'

    steps:
      - uses: actions/checkout@v4

      - name: Create test .env
        run: |
          cp .env.example .env
          sed -i 's/<strong_password_here>/test_password_ci/g' .env
          sed -i 's/<run:.*>/test_secret_key_for_ci_only_32charsx/g' .env
          sed -i 's|<your-ec2-ip-or-domain>|localhost|g' .env

      - name: Start services
        run: docker compose up -d --build --wait
        timeout-minutes: 10

      - name: Wait for health checks
        run: |
          echo "Waiting for backend health..."
          for i in {1..30}; do
            if curl -sf http://localhost/api/v1/health; then
              echo "Backend healthy!"
              break
            fi
            echo "Attempt $i/30 — waiting..."
            sleep 5
          done

      - name: Run smoke tests
        run: |
          # Health check
          curl -sf http://localhost/api/v1/health | grep -q "ok"
          # Nginx is up
          curl -sf http://localhost/nginx-health

      - name: Collect logs on failure
        if: failure()
        run: docker compose logs --tail=100

      - name: Tear down
        if: always()
        run: docker compose down -v