# ============================================================
# AIILA — ILA v0.1 MVP  |  nginx.dev.conf
# Owner: Sridhar — Cloud + DevOps + Infrastructure
# Purpose: Local development reverse proxy
#   - Routes /api/* → backend:8000
#   - Routes /ws    → backend:8000 (WebSocket upgrade)
#   - Routes /*     → frontend:3000 (Vite dev server)
# ============================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # ── Upstream definitions ───────────────────────────────
    upstream backend_api {
        server backend:8000;
        keepalive 32;
    }

    upstream frontend_dev {
        server frontend:80;
    }

    # ── Main server block ──────────────────────────────────
    server {
        listen 80;
        server_name localhost;

        client_max_body_size 50M;

        # ── Health check (Nginx itself) ──────────────────
        location /nginx-health {
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # ── API proxy ────────────────────────────────────
        location /api/ {
            proxy_pass         http://backend_api;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
        }

        # ── WebSocket proxy ──────────────────────────────
        location /ws {
            proxy_pass         http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_set_header   X-Real-IP  $remote_addr;
            proxy_read_timeout 3600s;   # Keep WS alive for 1 hour
            proxy_send_timeout 3600s;
        }

        # ── Flower (Celery monitoring) ────────────────────
        location /flower/ {
            proxy_pass         http://flower:5555/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            rewrite            ^/flower/(.*)$ /$1 break;
        }

        # ── Frontend (Vite dev server) ───────────────────
        location / {
            proxy_pass         http://frontend_dev;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_read_timeout 3600s;
        }
    }
}