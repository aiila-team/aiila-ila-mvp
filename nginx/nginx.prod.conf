# ============================================================
# AIILA — ILA v0.1 MVP  |  nginx.prod.conf
# Owner: Sridhar — Cloud + DevOps + Infrastructure
# Purpose: Production reverse proxy with SSL termination
# ============================================================

worker_processes auto;
worker_rlimit_nofile 65535;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ========================================================
    # SECURITY HEADERS
    # ========================================================

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ========================================================
    # PERFORMANCE
    # ========================================================

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 75;
    keepalive_requests 1000;

    client_max_body_size 50M;

    # ========================================================
    # GZIP
    # ========================================================

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;

    gzip_min_length 1000;

    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # ========================================================
    # RATE LIMITING
    # ========================================================

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;

    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ========================================================
    # LOGGING
    # ========================================================

    log_format json_combined escape=json
    '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":"$status",'
        '"bytes_sent":"$body_bytes_sent",'
        '"request_time":"$request_time",'
        '"upstream_response_time":"$upstream_response_time",'
        '"user_agent":"$http_user_agent"'
    '}';

    access_log /var/log/nginx/access.log json_combined;

    # ========================================================
    # UPSTREAMS
    # ========================================================

    upstream backend_api {
        server backend:8000;
        keepalive 64;
    }

    upstream flower_upstream {
        server flower:5555;
    }

    # ========================================================
    # HTTP → HTTPS REDIRECT
    # ========================================================

    server {

        listen 80;
        server_name _;

        return 301 https://$host$request_uri;
    }

    # ========================================================
    # HTTPS SERVER
    # ========================================================

    server {

        listen 443 ssl http2;
        server_name _;

        # ====================================================
        # SSL
        # ====================================================

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        ssl_protocols TLSv1.2 TLSv1.3;

        ssl_ciphers
            ECDHE-ECDSA-AES128-GCM-SHA256:
            ECDHE-RSA-AES128-GCM-SHA256:
            ECDHE-ECDSA-AES256-GCM-SHA384:
            ECDHE-RSA-AES256-GCM-SHA384;

        ssl_prefer_server_ciphers off;

        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        ssl_session_tickets off;

        limit_conn conn_limit 20;

        # ====================================================
        # HEALTH CHECK
        # ====================================================

        location /nginx-health {

            return 200 "OK\n";

            add_header Content-Type text/plain;
        }

        # ====================================================
        # LOGIN API
        # ====================================================

        location /api/v1/auth/login {

            limit_req zone=login_limit burst=5 nodelay;

            proxy_pass http://backend_api;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Connection "";
        }

        # ====================================================
        # MAIN API
        # ====================================================

        location /api/ {

            limit_req zone=api_limit burst=50 nodelay;

            proxy_pass http://backend_api;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Connection "";

            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;

            proxy_buffering on;

            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
        }

        # ====================================================
        # WEBSOCKET CONFIGURATION
        # ====================================================

        location /ws/ {

            proxy_pass http://backend_api;

            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            proxy_buffering off;
        }

        # ====================================================
        # FLOWER DASHBOARD
        # ====================================================

        location /flower/ {

            auth_basic "ILA Monitoring";

            auth_basic_user_file /etc/nginx/certs/.htpasswd;

            proxy_pass http://flower_upstream/;

            proxy_set_header Host $host;

            rewrite ^/flower/(.*)$ /$1 break;
        }

        # ====================================================
        # FRONTEND STATIC FILES
        # ====================================================

        root /usr/share/nginx/html;

        index index.html;

        location / {

            try_files $uri $uri/ /index.html;

            expires 1h;

            add_header Cache-Control "public, no-transform";
        }

        # ====================================================
        # STATIC ASSETS CACHE
        # ====================================================

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf)$ {

            expires 30d;

            add_header Cache-Control "public, immutable";
        }
    }
}