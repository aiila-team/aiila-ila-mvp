version: "3.9"

# ============================================================
# AIILA — ILA v0.1 MVP  |  docker-compose.yml (local dev)
# Owner: Sridhar — Cloud + DevOps + Infrastructure
# All services: postgres, neo4j, redis, backend, frontend,
#               nginx, flower
# Usage: docker compose up --build
# ============================================================

networks:
  ila-net:
    driver: bridge

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:
  redis_data:
  flower_data:

services:

  # ─────────────────────────────────────────
  # PostgreSQL 15 — relational store
  # ─────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: ila_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ila_db}
      POSTGRES_USER: ${POSTGRES_USER:-ila_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_dev}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ila_user} -d ${POSTGRES_DB:-ila_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ila-net

  # ─────────────────────────────────────────
  # Neo4j 5 Community — graph database
  # ─────────────────────────────────────────
  neo4j:
    image: neo4j:5-community
    container_name: ila_neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-changeme_dev}
      NEO4J_server_memory_heap_initial__size: 512M
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512M
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: "gds.*"
      NEO4J_dbms_security_procedures_allowlist: "gds.*"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/import
      - neo4j_plugins:/plugins
      - ./infra/neo4j/schema.cypher:/import/schema.cypher:ro
    ports:
      - "7474:7474"   # HTTP browser
      - "7687:7687"   # Bolt protocol
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - ila-net

  # ─────────────────────────────────────────
  # Redis 7 — Celery broker + WebSocket pub/sub + cache
  # ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ila_redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 60 1
      --loglevel warning
      --requirepass ${REDIS_PASSWORD:-changeme_dev}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme_dev}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ila-net

  # ─────────────────────────────────────────
  # FastAPI Backend
  # ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ila_backend
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      NEO4J_URI: bolt://neo4j:7687
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme_dev}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-changeme_dev}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-changeme_dev}@redis:6379/2
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ila-net

  # ─────────────────────────────────────────
  # Celery Worker
  # ─────────────────────────────────────────
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ila_celery_worker
    restart: unless-stopped
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4 -Q default,ingest,enrich,ml,neo4j_sync
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      NEO4J_URI: bolt://neo4j:7687
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme_dev}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-changeme_dev}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-changeme_dev}@redis:6379/2
    volumes:
      - ./backend:/app
    depends_on:
      - backend
      - redis
    networks:
      - ila-net

  # ─────────────────────────────────────────
  # Celery Beat — scheduler
  # ─────────────────────────────────────────
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ila_celery_beat
    restart: unless-stopped
    command: celery -A app.tasks.celery_app beat --loglevel=info --scheduler celery.schedulers.PersistentScheduler
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme_dev}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-changeme_dev}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-changeme_dev}@redis:6379/2
    volumes:
      - ./backend:/app
    depends_on:
      - redis
      - celery_worker
    networks:
      - ila-net

  # ─────────────────────────────────────────
  # Flower — Celery monitoring dashboard
  # ─────────────────────────────────────────
  flower:
    image: mher/flower:2.0
    container_name: ila_flower
    restart: unless-stopped
    command: celery flower --broker=redis://:${REDIS_PASSWORD:-changeme_dev}@redis:6379/1 --port=5555
    environment:
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-changeme_dev}@redis:6379/1
      FLOWER_BASIC_AUTH: ${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-admin}
    ports:
      - "5555:5555"
    depends_on:
      - redis
    volumes:
      - flower_data:/data
    networks:
      - ila-net

  # ─────────────────────────────────────────
  # React Frontend (dev mode)
  # ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ila_frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost/api
      VITE_WS_URL: ws://localhost/ws
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - ila-net

  # ─────────────────────────────────────────
  # Nginx — reverse proxy (HTTP only for dev)
  # ─────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: ila_nginx
    restart: unless-stopped
    volumes:
      - ./infra/nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - ila-net