version: '3.9'

services:

  postgres:
    image: postgres:15
    container_name: ila_postgres

    restart: always

    environment:
      POSTGRES_USER: ila_user
      POSTGRES_PASSWORD: ila_password123
      POSTGRES_DB: ila_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ilauser"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5
    container_name: ila_neo4j

    restart: always

    environment:
      NEO4J_AUTH: neo4j/password123

    ports:
      - "7474:7474"
      - "7687:7687"

    volumes:
      - neo4j_data:/data

    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:7474"]
      interval: 20s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7
    container_name: ila_redis

    restart: always

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: ila_backend

    restart: always

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

      neo4j:
        condition: service_healthy

      redis:
        condition: service_healthy

    environment:
      DATABASE_URL: postgresql://ilauser:ilapassword@postgres:5432/iladb
      REDIS_URL: redis://redis:6379
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: password123

  frontend:
    build: ./frontend
    container_name: ila_frontend

    restart: always

    ports:
      - "3000:3000"

    depends_on:
      - backend

  flower:
    image: mher/flower
    container_name: ila_flower

    restart: always

    ports:
      - "5555:5555"

    environment:
      CELERY_BROKER_URL: redis://redis:6379/0

    depends_on:
      - redis

  nginx:
    image: nginx:latest
    container_name: ila_nginx

    restart: always

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf

    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  neo4j_data:
  redis_data: